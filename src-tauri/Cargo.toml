[package]
name = "copets"
version = "0.2.1"
description = "A warm macOS desktop companion for Codex"
authors = ["CoPets contributors"]
edition = "2024"

[lib]
name = "copets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
